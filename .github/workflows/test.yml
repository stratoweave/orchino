name: Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actonlang/setup-acton@v1
        with:
          channel: "tip"
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Ensure generated code is up to date
        run: |
          make gen
          git diff --exit-code
      - name: Build project
        run: acton build
